<text x="20" y="28" class="h">NATIVE FORM VALIDATION</text>
<text x="60" y="90">Email</text><rect class="inp" x="60" y="100" width="420" height="44" fill="#17132b" stroke-width="3"/><text class="m1" x="75" y="128">alice@</text><text class="m1" x="60" y="170" fill="#ff8aa8">:invalid  typeMismatch - "Please enter an email"</text><text class="m2" x="75" y="128">alice@near.org</text><text class="m2" x="60" y="170" fill="#7ddeaf">:valid  checkValidity() === true</text><rect x="520" y="100" width="140" height="44" fill="#ff3fa4"/><text x="590" y="128" text-anchor="middle" style="fill:#0d0b1a">Submit</text><text x="60" y="240" class="t">&lt;input type="email" required&gt; + :user-invalid. Validate on the server too.</text>
</svg>