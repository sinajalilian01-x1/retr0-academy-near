<text x="20" y="28" class="h">CLOSURES KEEP THEIR SCOPE</text>
<rect x="40" y="70" width="280" height="170" class="box" style="stroke:#ff3fa4"/><text x="180.0" y="160.0" text-anchor="middle"></text><text x="55" y="95" fill="#ff3fa4">makeCounter()</text><text x="55" y="125">let count = 0</text><text x="55" y="155">return () =&gt; ++count</text><text x="55" y="215" class="t">returns, frame is gone...</text><g class="bp"><rect x="420" y="90" width="260" height="130" class="box" style="stroke:#ffd84a"/><text x="550.0" y="160.0" text-anchor="middle"></text><text x="440" y="118" fill="#ffd84a">inc (closure)</text><text x="440" y="150">[[scope]] -> count</text><text x="440" y="185" fill="#7ddeaf">inc() -> 1, 2, 3...</text></g><path class="wire flow" d="M320 155 H420"/><text x="40" y="295" class="t">...but the inner function still references count, so it lives on, private.</text>
</svg>