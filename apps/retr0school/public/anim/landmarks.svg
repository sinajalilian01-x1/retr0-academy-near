.box{fill:#17132b;stroke:#2e2858;stroke-width:2} .wire{stroke:#2e2858;stroke-width:3;fill:none;stroke-dasharray:6 6}
.flow{animation:dash 1s linear infinite} @keyframes dash{to{stroke-dashoffset:-12}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.fc{animation:focus 6s steps(1) infinite} @keyframes focus{0%{transform:translate(0,0)}20%{transform:translate(0,50px)}40%{transform:translate(0,100px)}60%{transform:translate(380px,100px)}80%{transform:translate(0,210px)}100%{transform:translate(0,0)}}
