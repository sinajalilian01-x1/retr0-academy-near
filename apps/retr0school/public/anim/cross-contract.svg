<text x="20" y="28" class="h">CROSS-CONTRACT CALL WITH CALLBACK</text>
<rect class="box blk" x="40" y="60" width="180" height="40" style="stroke:#ff3fa4"/><text x="130" y="85" text-anchor="middle">block N</text><rect class="box blk b2" x="270" y="60" width="180" height="40" style="stroke:#6ff6ff"/><text x="360" y="85" text-anchor="middle">block N+1</text><rect class="box blk b3" x="500" y="60" width="180" height="40" style="stroke:#7ddeaf"/><text x="590" y="85" text-anchor="middle">block N+2</text><rect x="60" y="150" width="180" height="80" class="box" style="stroke:#ff3fa4"/><text x="150.0" y="190.0" text-anchor="middle">Contract A</text><text x="150.0" y="208.0" text-anchor="middle" class="t">ext_b::get()</text><rect x="480" y="150" width="180" height="80" class="box" style="stroke:#6ff6ff"/><text x="570.0" y="190.0" text-anchor="middle">Contract B</text><text x="570.0" y="208.0" text-anchor="middle" class="t">fn get()</text><path class="wire flow" d="M240 175 H480"/><path class="wire flow" d="M480 210 H240"/><rect x="-7" y="-7" width="14" height="14" fill="#ffd84a"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M240 175 H480"/></rect><rect x="-7" y="-7" width="14" height="14" fill="#7ddeaf"><animateMotion dur="6s" begin="-3s" repeatCount="indefinite" path="M480 210 H240 H240"/></rect><text x="360" y="168" text-anchor="middle" class="t">Promise (receipt)</text><text x="360" y="232" text-anchor="middle" class="t">.then(on_result) callback</text><text x="20" y="285" class="t">A is NOT paused: its state changes in block N are already committed.</text><text x="20" y="305" fill="#ffd84a">Handle failure in the callback and roll back by hand.</text>
