<text x="20" y="28" class="h">THE CSS BOX MODEL</text>
<rect x="120" y="50" width="480" height="230" fill="#ffd84a22" stroke="#ffd84a" stroke-dasharray="6 4"/><text x="130" y="68" fill="#ffd84a">margin</text><rect x="170" y="80" width="380" height="170" fill="none" stroke="#ff3fa4" stroke-width="6" class="p"/><text x="182" y="102" fill="#ff3fa4">border</text><rect x="200" y="110" width="320" height="110" fill="#6ff6ff22" stroke="#6ff6ff"/><text x="210" y="128" fill="#6ff6ff">padding</text><rect x="270" y="140" width="180" height="50" fill="#7ddeaf33" stroke="#7ddeaf"/><text x="360" y="170" text-anchor="middle" fill="#7ddeaf">content</text><text x="20" y="305" class="t">box-sizing: border-box -> width includes padding + border, never margin.</text>
