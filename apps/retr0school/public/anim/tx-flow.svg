 x="0" y="136" width="720" height="1" fill="#2e2858"/><rect x="0" y="140" width="720" height="1" fill="#2e2858"/><rect x="0" y="144" width="720" height="1" fill="#2e2858"/><rect x="0" y="148" width="720" height="1" fill="#2e2858"/><rect x="0" y="152" width="720" height="1" fill="#2e2858"/><rect x="0" y="156" width="720" height="1" fill="#2e2858"/><rect x="0" y="160" width="720" height="1" fill="#2e2858"/><rect x="0" y="164" width="720" height="1" fill="#2e2858"/><rect x="0" y="168" width="720" height="1" fill="#2e2858"/><rect x="0" y="172" width="720" height="1" fill="#2e2858"/><rect x="0" y="176" width="720" height="1" fill="#2e2858"/><rect x="0" y="180" width="720" height="1" fill="#2e2858"/><rect x="0" y="184" width="720" height="1" fill="#2e2858"/><rect x="0" y="188" width="720" height="1" fill="#2e2858"/><rect x="0" y="192" width="720" height="1" fill="#2e2858"/><rect x="0" y="196" width="720" height="1" fill="#2e2858"/><rect x="0" y="200" width="720" height="1" fill="#2e2858"/><rect x="0" y="204" width="720" height="1" fill="#2e2858"/><rect x="0" y="208" width="720" height="1" fill="#2e2858"/><rect x="0" y="212" width="720" height="1" fill="#2e2858"/><rect x="0" y="216" width="720" height="1" fill="#2e2858"/><rect x="0" y="220" width="720" height="1" fill="#2e2858"/><rect x="0" y="224" width="720" height="1" fill="#2e2858"/><rect x="0" y="228" width="720" height="1" fill="#2e2858"/><rect x="0" y="232" width="720" height="1" fill="#2e2858"/><rect x="0" y="236" width="720" height="1" fill="#2e2858"/><rect x="0" y="240" width="720" height="1" fill="#2e2858"/><rect x="0" y="244" width="720" height="1" fill="#2e2858"/><rect x="0" y="248" width="720" height="1" fill="#2e2858"/><rect x="0" y="252" width="720" height="1" fill="#2e2858"/><rect x="0" y="256" width="720" height="1" fill="#2e2858"/><rect x="0" y="260" width="720" height="1" fill="#2e2858"/><rect x="0" y="264" width="720" height="1" fill="#2e2858"/><rect x="0" y="268" width="720" height="1" fill="#2e2858"/><rect x="0" y="272" width="720" height="1" fill="#2e2858"/><rect x="0" y="276" width="720" height="1" fill="#2e2858"/><rect x="0" y="280" width="720" height="1" fill="#2e2858"/><rect x="0" y="284" width="720" height="1" fill="#2e2858"/><rect x="0" y="288" width="720" height="1" fill="#2e2858"/><rect x="0" y="292" width="720" height="1" fill="#2e2858"/><rect x="0" y="296" width="720" height="1" fill="#2e2858"/><rect x="0" y="300" width="720" height="1" fill="#2e2858"/><rect x="0" y="304" width="720" height="1" fill="#2e2858"/><rect x="0" y="308" width="720" height="1" fill="#2e2858"/><rect x="0" y="312" width="720" height="1" fill="#2e2858"/><rect x="0" y="316" width="720" height="1" fill="#2e2858"/></g>
<text x="20" y="28" class="h">LIFE OF A NEAR TRANSACTION</text>
<rect x="20" y="110" width="110" height="70" class="box" style="stroke:#ff3fa4"/><text x="75.0" y="145.0" text-anchor="middle">Wallet</text><text x="75.0" y="163.0" text-anchor="middle" class="t">signs tx</text><rect x="170" y="110" width="110" height="70" class="box" style="stroke:#2e2858"/><text x="225.0" y="145.0" text-anchor="middle">RPC node</text><text x="225.0" y="163.0" text-anchor="middle" class="t">forwards</text><rect x="320" y="110" width="120" height="70" class="box" style="stroke:#6ff6ff"/><text x="380.0" y="145.0" text-anchor="middle">Validators</text><text x="380.0" y="163.0" text-anchor="middle" class="t">chunk+block</text><rect x="480" y="110" width="100" height="70" class="box" style="stroke:#2e2858"/><text x="530.0" y="145.0" text-anchor="middle">Receipt</text><text x="530.0" y="163.0" text-anchor="middle" class="t">on shard</text><rect x="610" y="110" width="90" height="70" class="box" style="stroke:#7ddeaf"/><text x="655.0" y="145.0" text-anchor="middle">Contract</text><text x="655.0" y="163.0" text-anchor="middle" class="t">executes</text><path class="wire flow" d="M130 145 H170"/><path class="wire flow" d="M280 145 H320"/><path class="wire flow" d="M440 145 H480"/><path class="wire flow" d="M580 145 H610"/><rect x="-7" y="-7" width="14" height="14" fill="#ffd84a"><animateMotion dur="4s" begin="0s" repeatCount="indefinite" path="M75 145 H655"/></rect><text x="20" y="230" class="t">1. Wallet signs with your access key  2. RPC forwards it  3. Validators add it to a chunk</text><text x="20" y="252" class="t">4. It becomes a receipt on the receiver shard  5. Contract runs, burns gas, returns</text><text x="20" y="290" fill="#7ddeaf">~1-2 s finality</text>
</svg>