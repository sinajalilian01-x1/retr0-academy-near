<text x="20" y="28" class="h">THE JAVASCRIPT EVENT LOOP</text>
<rect x="20" y="50" width="170" height="200" class="box" style="stroke:#ff3fa4"/><text x="105.0" y="155.0" text-anchor="middle"></text><text x="105" y="72" text-anchor="middle" fill="#ff3fa4">Call stack</text><rect x="270" y="50" width="200" height="90" class="box" style="stroke:#6ff6ff"/><text x="370.0" y="100.0" text-anchor="middle"></text><text x="370" y="72" text-anchor="middle" fill="#6ff6ff">Web APIs</text><text x="370" y="110" text-anchor="middle" class="t">setTimeout, fetch</text><rect x="270" y="165" width="420" height="40" class="box" style="stroke:#7ddeaf"/><text x="480.0" y="190.0" text-anchor="middle"></text><text x="280" y="190" class="t">microtasks</text><rect x="270" y="225" width="420" height="40" class="box" style="stroke:#ffd84a"/><text x="480.0" y="250.0" text-anchor="middle"></text><text x="280" y="250" class="t">macrotasks</text><rect x="-9" y="-9" width="18" height="18" fill="#6ff6ff"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M105 230 V100 H370 V100"/></rect><g><rect x="430" y="175" width="60" height="20" fill="#7ddeaf"><animate attributeName="x" values="600;430;430;105;105" keyTimes="0;.3;.5;.7;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="175;175;175;175;120" keyTimes="0;.3;.5;.7;1" dur="6s" repeatCount="indefinite"/></rect></g><rect x="600" y="235" width="60" height="20" fill="#ffd84a"><animate attributeName="x" values="640;520;520;105" keyTimes="0;.4;.8;1" dur="6s" repeatCount="indefinite"/><animate attributeName="y" values="235;235;235;90" keyTimes="0;.4;.8;1" dur="6s" repeatCount="indefinite"/></rect><text x="20" y="300" class="t">Stack empty -> run ALL microtasks -> then ONE macrotask -> repeat.</text>
