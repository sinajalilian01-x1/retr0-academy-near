<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-label="CSS Grid tracks and spans">
<title>CSS Grid tracks and spans</title>
<style>
text{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#e8e6ff;font-size:14px}
.t{font-size:12px;fill:#8480b8} .h{font-size:15px;font-weight:700;fill:#ffd84a;letter-spacing:1px}
.box{fill:#17132b;stroke:#2e2858;stroke-width:2} .wire{stroke:#2e2858;stroke-width:3;fill:none;stroke-dasharray:6 6}
.flow{animation:dash 1s linear infinite} @keyframes dash{to{stroke-dashoffset:-12}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.gi{animation:span 6s ease-in-out infinite} @keyframes span{0%,30%{width:130px}45%,80%{width:280px}95%,100%{width:130px}} .gj{animation:mv 6s ease-in-out infinite} @keyframes mv{0%,30%{transform:none}45%,80%{transform:translate(-150px,90px)}95%,100%{transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
